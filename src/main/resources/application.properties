# Application settings
server.port=${PORT:8080}
spring.application.name=finance-advisor

# Groq API Key (will use environment variable in production)
groq.api.key=${GROQ_API_KEY}

# CORS - Allow frontend domain (will be updated after deployment)
cors.allowed.origins=${FRONTEND_URL:http://localhost:3000}

# Actuator - expose only /actuator/health over HTTP (used by the Docker HEALTHCHECK).
# Also turn off the /actuator index page and the liveness/readiness probe groups,
# which Spring Boot 4 enables by default but nothing here uses.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=false
