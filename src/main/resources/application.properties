# Application settings
server.port=${PORT:8080}
spring.application.name=finance-advisor

# Groq API Key (will use environment variable in production)
groq.api.key=${GROQ_API_KEY}

# CORS - Allow frontend domain (will be updated after deployment)
cors.allowed.origins=${FRONTEND_URL:http://localhost:3000}

# Groq model settings (overridable per environment)
groq.api.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.api.temperature=0.7
groq.api.max-tokens=3000

# Upstream call timeouts. Without these a stalled Groq call holds its thread forever.
groq.api.connect-timeout-seconds=10
groq.api.read-timeout-seconds=60
