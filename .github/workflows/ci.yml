name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No GROQ_API_KEY is set here on purpose: the tests must not depend on a
      # real credential, and the app must still fail fast in production without one.
      - name: Test and package
        run: mvn -B verify
